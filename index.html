<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="lista-de-tarefas/css/style.css">
</head>
<body>
    <main class="container">
        <h1>Lista de Tarefas</h1>

        <section class="form-tarefa">
            <input type="text" id="tarefa" placeholder="Digite uma tarefa...">
            <button id="btnAdicionar">Adicionar</button>
        </section>

        <ul id="listaTarefas">
            <li class="tarefa">
                <span>Estudar JavaScript</span>
                <div class="acoes">
                    <button class="btn-excluir">🗑️</button>
                    <button class="btn-concluir">✔️</button>
                </div>
            </li>
            <li class="tarefa">
                <span>Estudar Banco de Dados</span>
                <div class="acoes">
                    <button class="btn-excluir">🗑️</button>
                    <button class="btn-concluir">✔️</button>
                </div>
            </li>
            <li class="tarefa">
                <span>Fazer Exercícios</span>
                <div class="acoes">
                    <button class="btn-excluir">🗑️</button>
                    <button class="btn-concluir">✔️</button>
                </div>
            </li>
        </ul>
    </main>

    <script src="lista-de-tarefas/js/script.js"></script>
</body>
</html>
